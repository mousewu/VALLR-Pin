# Production starting point for ROI96 .npy manifests produced by
# scripts/preprocess_stage1_roi.py after build_stage1_manifests.py.
# batch_size is per GPU.
train_manifest: data/stage1/train.roi.jsonl
dev_manifest: data/stage1/dev.roi.jsonl
data_root: ""
out_dir: exp/stage1_pinyin_auxchar

epochs: 50
batch_size: 8
max_frames_per_batch: 2400  # 每卡 padding 后的总帧预算；长句会自动缩小 batch
bucket_size: 40
epoch_samples: 0
# Natural corpus proportions by default. Add explicit source weights only when
# every named source is present in the built manifest.
source_weights: {}
accum_steps: 4
lr: 5.0e-4
warmup_steps: 10000
weight_decay: 0.01
grad_clip: 5.0
num_workers: 8
crop_size: 88
time_mask: 4
flip_prob: 0.5
mean: 0.421
std: 0.165
max_frames: 0
min_frames: 4
require_roi_metadata: true
expected_fps: 25.0
device: auto
amp: true
compile: false
resume: ""
save_every: 2
keep_ckpts: 8
eval_every: 1
selection_metric: ser
save_best_per_metric: true
log_every: 50
seed: 2026

swanlab:
  enabled: false
  project: VALLR-Pin
  experiment_name: stage1-pinyin-aux-char
  mode: online
  logdir: swanlog

model:
  d_model: 512
  heads: 8
  ffn: 2048
  enc_layers: 12
  sanm_kernel: 11
  dropout: 0.1
  frontend: resnet18
  frontend_width: 64
  in_channels: 1
  text_ctc_weight: 0.1
  pinyin_ctc_weight: 0.9
  lambda_ctc: 1.0
  char_dec_layers: 0
  pinyin_dec_layers: 0
  label_smoothing: 0.0
  architecture_version: 2
