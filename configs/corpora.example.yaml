# Copy this file, replace paths/field mappings after inspecting your release,
# then run: python scripts/build_stage1_manifests.py configs/corpora.local.yaml
out_dir: data/stage1
seed: 2026
dev_speaker_percent: 5
test_speaker_percent: 5
min_chars: 2
max_chars: 80
min_frames_per_label: 1.5
allow_pseudo: false
min_pseudo_confidence: 0.95
require_speaker: true

sources:
  # Official release layout:
  # <part>/<speaker>/{video,txt,landmark,roi,audio}/<utterance>.*
  - name: cn_cvs
    root: /DATA/CN-CVS
    annotation: "**/txt/*.txt"
    format: cn_cvs
    default_split: ""       # empty = deterministic speaker split
    input_type: face_crop
    supervision: supervised

  # Official mirrored layout: text/sN/date/x.txt <-> sN/date/x.mp4.
  # Basenames are not globally unique, so use the dedicated cmlr adapter.
  - name: cmlr
    root: /DATA/CMLR
    annotation: "text/**/*.txt"
    format: cmlr
    default_split: ""
    # With only 11 speakers, an explicit published/experimental protocol is
    # preferable, for example: {s1: train, s9: dev, s11: test}.
    speaker_split_map: {}
    input_type: raw_scene
    supervision: supervised

  # CN-Celeb-AV/CNC-AV is not a supervised VSR source unless sentence-level
  # transcripts exist. Keep it disabled until reliable pseudo labels are made.
  - name: cnc_av_pseudo
    enabled: false
    root: /DATA/CNC-AV
    annotation: pseudo_labels.jsonl
    format: jsonl
    supervision: pseudo
    pseudo_confidence: 0.0
    input_type: raw_scene
    media_root: videos
    media_glob: "**/*"

  # Additional CNVSRC fixed-track releases use the same generic adapters.
  # Enable each entry only after matching its actual metadata layout.
  - name: cnvsrc_dev
    enabled: false
    root: /DATA/CNVSRC-Dev
    annotation: metadata.jsonl
    format: jsonl
    input_type: face_crop
    media_root: videos
    media_glob: "**/*"
    supervision: supervised

  - name: cn_cvs2_p1
    enabled: false
    root: /DATA/CN-CVS2-P1
    annotation: metadata.jsonl
    format: jsonl
    input_type: face_crop
    media_root: videos
    media_glob: "**/*"
    supervision: supervised

  - name: cn_cvs3
    enabled: false
    root: /DATA/CN-CVS3
    annotation: metadata.jsonl
    format: jsonl
    input_type: face_crop
    media_root: videos
    media_glob: "**/*"
    supervision: supervised
