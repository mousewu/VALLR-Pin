# Stage-I 训练配置：对标论文在 CNVSRC 固定赛道 (S3) 上的设置。
# 数据先构建原始 manifest，再用 scripts/preprocess_stage1_roi.py 统一成 ROI manifest。
train_manifest: data/cnvsrc/train.roi.jsonl
dev_manifest: data/cnvsrc/multi_dev.roi.jsonl
data_root: data/cnvsrc
out_dir: exp/vallr_pin_cnvsrc

epochs: 75
batch_size: 8            # 单卡 A100-80G 的经验值；显存不足时配合 accum_steps
accum_steps: 4
lr: 1.0e-3               # Noam 式 warmup + 1/sqrt(step) 衰减
warmup_steps: 10000
weight_decay: 0.01
grad_clip: 5.0
num_workers: 8
crop_size: 88
require_roi_metadata: true
expected_fps: 25.0
time_mask: 4             # 时域随机遮蔽，缓解多说话人过拟合
device: auto
amp: true
save_every: 5            # 训练恢复和消融分析；Stage-II 主训练不依赖这些检查点
keep_ckpts: 8
eval_every: 1
seed: 0

swanlab:
  enabled: false
  project: VALLR-Pin
  experiment_name: stage1-cnvsrc-pinyin-only
  mode: online
  logdir: swanlog

model:
  d_model: 512
  heads: 8
  ffn: 2048
  enc_layers: 12         # SANM encoder (Paraformer 规格)
  char_dec_layers: 0     # v2 为纯 CTC；字段仅用于旧配置兼容
  pinyin_dec_layers: 0
  sanm_kernel: 11
  dropout: 0.1
  frontend: resnet50     # 论文用 ResNet-50；显存紧张可换 resnet18
  frontend_width: 64
  in_channels: 1
  lambda_ctc: 1.0        # v2 固定为 CTC
  text_ctc_weight: 0.0   # 解耦主方案：只训练无声调拼音 CTC
  pinyin_ctc_weight: 1.0
  label_smoothing: 0.0
  architecture_version: 2
