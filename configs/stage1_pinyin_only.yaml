# Ablation A: visual -> toneless-pinyin CTC only.
train_manifest: data/stage1/train.jsonl
dev_manifest: data/stage1/dev.jsonl
out_dir: exp/stage1_pinyin_only
epochs: 50
batch_size: 8
bucket_size: 40
# Empty means sample every source present in the manifest at its natural rate.
# Set explicit probabilities only after all listed sources are actually present.
source_weights: {}
accum_steps: 4
lr: 5.0e-4
warmup_steps: 10000
weight_decay: 0.01
grad_clip: 5.0
num_workers: 8
crop_size: 88
time_mask: 4
amp: true
selection_metric: ser
seed: 2026
swanlab:
  enabled: false
  project: VALLR-Pin
  experiment_name: stage1-pinyin-only
  mode: online
  logdir: swanlog
model:
  d_model: 512
  heads: 8
  ffn: 2048
  enc_layers: 12
  sanm_kernel: 11
  dropout: 0.1
  frontend: resnet18
  frontend_width: 64
  alpha: 0.0
  architecture_version: 2
