<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALLR-Pin Data Pipeline</title><style>
:root{--bg:#0b1020;--panel:#121a2f;--line:#24304d;--text:#e8edf7;--muted:#8e9bb7;--blue:#5b8cff;--green:#35d07f;--red:#ff6577;--yellow:#f3bd4e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17264a 0,transparent 32%),var(--bg);color:var(--text);font:14px ui-sans-serif,system-ui,-apple-system}
main{max-width:1450px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}h1{font-size:25px;margin:0 0 5px}.sub{color:var(--muted)}button,input,select,textarea{background:#0d1427;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px}textarea{font:inherit;resize:vertical;min-height:76px}button{cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);font-weight:700}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card,.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #0003}.card{padding:17px}.num{font-size:26px;font-weight:750;margin-top:6px}.label{color:var(--muted);font-size:12px}.panels{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px;overflow:hidden}.panel h2{font-size:15px;margin:0 0 14px}.form{display:grid;grid-template-columns:1fr 150px 100px;gap:8px;margin-bottom:20px}.form .wide{grid-column:1/-1}.checks{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.checks label{color:var(--muted);font-size:12px}.checks input{vertical-align:middle}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:9px;border-bottom:1px solid var(--line)}td{padding:10px 9px;border-bottom:1px solid #202a42;vertical-align:middle}.pill{display:inline-block;padding:3px 7px;border-radius:99px;font-size:11px;background:#27324d}.succeeded{color:var(--green)}.failed{color:var(--red)}.running{color:var(--blue)}.queued{color:var(--yellow)}.bar{height:4px;background:#25304a;border-radius:9px;margin-top:5px}.bar>i{display:block;height:100%;background:var(--blue);border-radius:9px}.actions button{padding:4px 7px;font-size:11px;margin-right:3px}.node{padding:11px 0;border-bottom:1px solid var(--line)}.node b{display:block}.node small{color:var(--muted)}.empty{color:var(--muted);padding:30px;text-align:center}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.panels{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.form textarea{grid-column:1/-1}}
@media(max-width:900px){main{padding:18px}.panel{overflow-x:auto}table{min-width:680px}}
@media(max-width:480px){.top{align-items:flex-start}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.form>*{grid-column:1/-1}}
</style></head><body><main><div class="top"><div><h1>VALLR-Pin 数据流水线</h1><div class="sub">原始采集 · 通用分析 · 模型适配</div></div><div id="clock" class="sub"></div></div>
<section class="grid" id="summary"></section><section class="panels"><div class="panel"><h2>批量采集（模型无关）</h2><form class="form" id="collectForm"><textarea class="wide" id="urls" placeholder="每行一个 YouTube 视频 URL" required></textarea><input id="speaker" placeholder="说话人 ID（可选）"><span class="sub">自动执行 download → analyze</span><button class="primary">批量提交</button></form><h2>创建模型适配数据</h2><form class="form" id="renderForm"><textarea class="wide" id="videoIds" placeholder="每行一个已完成 analyze 的 video_id" required></textarea><div class="checks wide" id="renderSpecs"><label><input type="checkbox" value="vallr_pin" checked> vallr_pin</label><label><input type="checkbox" value="syncnet"> syncnet</label><label><input type="checkbox" value="avhubert"> avhubert</label><label><input type="checkbox" value="auto_avsr"> auto_avsr</label><label><input type="checkbox" value="cnvsrc_baseline"> cnvsrc_baseline</label></div><span class="sub">同一分析产物可生成多种格式</span><button class="primary">提交渲染</button></form><h2>任务</h2><table><thead><tr><th>类型 / ID</th><th>状态</th><th>进度</th><th>尝试</th><th>节点 / 信息</th><th>操作</th></tr></thead><tbody id="tasks"></tbody></table></div><aside class="panel"><h2>工作节点</h2><div id="nodes"></div><h2 style="margin-top:24px">三段式流水线</h2><div class="sub">download 保存原始视频和字幕；analyze 只生成人脸轨迹等通用标注；render 才选择具体模型规格。SQLite 只放控制节点，三类 Worker 通过 HTTP API 取任务并共享 data/ 存储。</div></aside></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt){let r=await fetch(path,opt);let x=await r.json();if(!r.ok)throw Error(x.error||r.status);return x}
function cards(s){let states=s.states||{}, kinds=s.kinds||{};let x=[['总任务',Object.values(states).reduce((a,b)=>a+b,0)],['排队',states.queued||0],['运行',states.running||0],['成功',states.succeeded||0],['分析任务',kinds.analyze||0],['渲染任务',kinds.render||0]];return x.map(a=>`<div class="card"><div class="label">${a[0]}</div><div class="num">${a[1]}</div></div>`).join('')}
function acts(t){if(t.status==='queued')return `<button onclick="op('${t.id}','pause')">暂停</button><button onclick="op('${t.id}','cancel')">取消</button>`;if(t.status==='paused')return `<button onclick="op('${t.id}','resume')">继续</button><button onclick="op('${t.id}','cancel')">取消</button>`;if(['failed','cancelled'].includes(t.status))return `<button onclick="op('${t.id}','retry')">重试</button>`;if(t.status==='running')return `<button onclick="op('${t.id}','cancel')">取消</button>`;return ''}
function row(t){let vid=t.result?.video_id||t.payload?.video_id||'';return `<tr><td><b>${esc(t.kind)}</b><br><small class="sub">${t.id.slice(0,10)}${vid?' · '+esc(vid):''}</small></td><td class="${t.status}">${esc(t.status)}</td><td>${Math.round(t.progress*100)}%<div class="bar"><i style="width:${t.progress*100}%"></i></div></td><td>${t.attempts}/${t.max_attempts}</td><td>${esc(t.leased_by||'—')}<br><small class="sub">${esc(t.message||t.error).slice(0,80)}</small></td><td class="actions">${acts(t)}</td></tr>`}
async function refresh(){try{let [s,t]=await Promise.all([api('/api/summary'),api('/api/tasks')]);summary.innerHTML=cards(s);tasks.innerHTML=t.length?t.map(row).join(''):`<tr><td colspan="6" class="empty">暂无任务</td></tr>`;nodes.innerHTML=(s.nodes||[]).map(n=>`<div class="node"><b>${esc(n.id)} <span class="${n.status==='busy'?'running':'succeeded'}">●</span></b><small>${esc(n.role)} · ${esc(n.hostname)} · ${esc(n.status)}</small></div>`).join('')||'<div class="empty">暂无在线节点</div>';clock.textContent=new Date().toLocaleTimeString()}catch(e){clock.textContent='连接失败: '+e.message}}
async function op(id,a){try{await api(`/api/tasks/${id}/${a}`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});refresh()}catch(e){alert(e.message)}}
const lines=s=>s.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
collectForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls:lines(urls.value),speaker_id:speaker.value})});urls.value='';refresh()}catch(e){alert(e.message)}};
renderForm.onsubmit=async e=>{e.preventDefault();try{let specs=[...renderSpecs.querySelectorAll('input:checked')].map(x=>x.value);await api('/api/renders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video_ids:lines(videoIds.value),specs})});videoIds.value='';refresh()}catch(e){alert(e.message)}};refresh();setInterval(refresh,3000)
</script></body></html>
